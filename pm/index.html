<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Number Ten</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A detailed prime minister simulation set in Westminster.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%225%22 fill=%22%238e1c23%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-family=%22Arial%22 font-weight=%22700%22 font-size=%2218%22 text-anchor=%22middle%22 fill=%22%23f3d98a%22%3E10%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a civil service briefing pack. Classification strip, a KPI ledger, tabbed departments,
   and decisions that arrive as despatch-box papers. Commons green for the government,
   red-box leather for anything that needs a decision. */
:root {
  --paper: #EEF2EF; --card: #FFFFFF; --card-2: #F5F8F6; --ink: #13201A; --muted: #56675E; --line: #CCD6D0;
  --bench: #1F5C43; --bench-soft: #DDEBE3; --box: #8E1C23; --box-soft: #F6E3E3; --brass: #A47F22; --on-box: #FFFFFF;
  --good: #23784A; --warn: #A2640A; --bad: #B3261E;
  --pL: #C8333B; --pR: #2B5FB3; --pLD: #E09A12; --pP: #12A2AE; --pG: #4E9A2B; --pS: #D9B800; --pNI: #8B8F8C; --pO: #B9BDBA;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0D1512; --card: #141E1A; --card-2: #192520; --ink: #E2EBE6; --muted: #92A59B; --line: #2A3A33;
  --bench: #5DB48C; --bench-soft: #183027; --box: #E46A70; --box-soft: #3A1B1D; --brass: #D5B259; --on-box: #1A0A0B;
  --good: #5CC48A; --warn: #E3A64B; --bad: #F07A70;
  --pL: #E8636A; --pR: #6E9BEA; --pLD: #F2B53E; --pP: #3CC6D0; --pG: #79C155; --pS: #EFD43C; --pNI: #A7ABA8; --pO: #6F7672;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0D1512; --card: #141E1A; --card-2: #192520; --ink: #E2EBE6; --muted: #92A59B; --line: #2A3A33;
  --bench: #5DB48C; --bench-soft: #183027; --box: #E46A70; --box-soft: #3A1B1D; --brass: #D5B259; --on-box: #1A0A0B;
  --good: #5CC48A; --warn: #E3A64B; --bad: #F07A70;
  --pL: #E8636A; --pR: #6E9BEA; --pLD: #F2B53E; --pP: #3CC6D0; --pG: #79C155; --pS: #EFD43C; --pNI: #A7ABA8; --pO: #6F7672;
  color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
html { -webkit-text-size-adjust: 100% }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--f-body); }
body.locked { overflow: hidden }
#app { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 32px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15 }
h2 { font-size: 1.2rem; font-weight: 600 }
h3 { font-size: 1rem; font-weight: 600; margin-top: 16px; margin-bottom: 6px }
p { margin: 0 }
.muted { color: var(--muted) }
.small { font-size: .85rem }
.good { color: var(--good) } .warn { color: var(--warn) } .bad { color: var(--bad) }
.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--f-mono); font-size: .9em }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0) }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px }

/* buttons */
.btn { font: 600 .9rem var(--f-body); padding: 9px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
.btn:hover:not([disabled]) { border-color: var(--bench) }
.btn[disabled] { opacity: .45; cursor: not-allowed }
.btn.primary { background: var(--box); border-color: var(--box); color: var(--on-box) }
.btn.primary:hover:not([disabled]) { filter: brightness(1.08); border-color: var(--box) }
.btn.danger { color: var(--bad) }
.btn.big { padding: 13px 20px; font-size: 1rem }
.btn.small { padding: 6px 10px; font-size: .82rem; margin-top: 8px }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font: inherit }

/* header */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); padding-bottom: 8px; border-bottom: 1px solid var(--line); margin-bottom: 18px }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper) }
.classify { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--box); color: var(--on-box); font: 500 .68rem var(--f-mono); letter-spacing: .14em; padding: 4px 10px; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.topline { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding-top: 12px }
.who { flex: 1 1 260px; min-width: 0 }
.brand { font-size: 1.6rem; font-weight: 700; letter-spacing: -.01em }
.date { color: var(--muted); font-size: .88rem }
.date strong { color: var(--ink); font-weight: 600 }
.pm { display: flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--muted) }
.pdot { width: 10px; height: 10px; border-radius: 50%; display: inline-block }
.next { padding: 11px 18px; font-size: .95rem }
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; margin: 12px 0 10px }
.kpis > div { background: var(--card); padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0 }
.kpis dt { font: 500 .68rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.kpis dd { margin: 0; font: 600 1.35rem var(--f-display); font-variant-numeric: tabular-nums }
.kpis .sub { font-size: .75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.meter { display: block; height: 4px; background: var(--card-2); border-radius: 2px; overflow: hidden }
.meter > span { display: block; height: 100%; background: var(--warn) }
.meter.good > span { background: var(--good) } .meter.bad > span { background: var(--bad) }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none }
.tab { font: 600 .9rem var(--f-display); letter-spacing: .02em; background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px; color: var(--muted); cursor: pointer; white-space: nowrap }
.tab.on { color: var(--ink); border-bottom-color: var(--bench) }

/* layout */
.panel { display: flex; flex-direction: column; gap: 16px }
.grid { display: grid; gap: 16px }
.grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)) }
.grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)) }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; display: flex; flex-direction: column; gap: 10px }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0 }
.s-l { font: 500 .7rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.s-v { font: 600 1.45rem var(--f-display); font-variant-numeric: tabular-nums }
.s-s { font-size: .8rem; color: var(--muted) }
.callout { padding: 10px 12px; border-radius: var(--r); background: var(--card-2); font-size: .9rem; border-left: 3px solid var(--line) }
.callout.good { border-left-color: var(--good) } .callout.bad { border-left-color: var(--bad) } .callout.warn { border-left-color: var(--warn) }
.callout.good, .callout.bad, .callout.warn { color: var(--ink) }
.row-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
.hint { font-size: .8rem; color: var(--muted) }

/* red box */
.redbox { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; background: var(--line); border-radius: var(--r); overflow: hidden }
.redbox li { background: var(--card-2); padding: 10px 12px; display: grid; grid-template-columns: 9.5rem 1fr; gap: 10px; font-size: .9rem; border-left: 3px solid transparent }
.redbox li.warn { border-left-color: var(--warn) } .redbox li.bad { border-left-color: var(--bad) }
.rb-t { font: 600 .82rem var(--f-display); text-transform: uppercase; letter-spacing: .04em; color: var(--muted) }

/* news */
.news { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column }
.news li { display: grid; grid-template-columns: 8.5rem 1fr; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: .9rem }
.news li:first-child { border-top: 0 }
.news time { font: .78rem var(--f-mono); color: var(--muted); padding-top: 2px }
.news li.good span { border-left: 3px solid var(--good); padding-left: 8px }
.news li.bad span { border-left: 3px solid var(--bad); padding-left: 8px }
.news li.neutral span { border-left: 3px solid var(--line); padding-left: 8px }

/* charts */
.chart { width: 100%; height: auto; display: block }
.chart .grid { stroke: var(--line); stroke-width: 1 }
.chart .ref { stroke: var(--muted); stroke-dasharray: 4 4; stroke-width: 1 }
.chart .tick { fill: var(--muted); font: 11px var(--f-mono) }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .8rem; color: var(--muted) }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px }
.legend i.dash { height: 0; border-top: 2px dashed var(--muted); width: 14px; vertical-align: 3px }

/* tables */
.tbl { width: 100%; border-collapse: collapse; font-size: .88rem }
.tbl caption { text-align: left; font: 600 .78rem var(--f-display); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding-bottom: 4px }
.tbl th { text-align: left; font: 600 .74rem var(--f-display); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line) }
.tbl td { padding: 5px 8px; border-bottom: 1px solid var(--line) }
.tbl tr.tot td { font-weight: 600; border-bottom: 0 }
.tbl .pd { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px }
.split > * { min-width: 0 }
.table-wrap { overflow-x: auto }
.cab select { font: .82rem var(--f-body); max-width: 13rem; padding: 4px; border: 1px solid var(--line); border-radius: 4px; background: var(--card); color: var(--ink) }
.pips { font-family: var(--f-mono) }

/* services, groups */
.svc-list, .groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px }
.svc, .grp { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; background: var(--card-2) }
.svc-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px }
.score { font: 600 1.05rem var(--f-display); font-variant-numeric: tabular-nums }

/* parliament */
.commons { width: 100%; height: auto; display: block }
.parties { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 4px 16px; font-size: .88rem }
.parties li { display: flex; align-items: center; gap: 8px }
.parties li .num { margin-left: auto }
.parties i { width: 10px; height: 10px; border-radius: 50%; flex: none }
.bills-prog { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px }
.bills-prog > li { display: flex; flex-direction: column; gap: 6px }
.stages { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; font: .72rem var(--f-mono) }
.stages li { padding: 4px 6px; background: var(--card-2); color: var(--muted); border-radius: 3px; text-align: center }
.stages li.done { background: var(--bench-soft); color: var(--bench) }
.stages li.now { background: var(--bench); color: var(--card) }
.bill-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px }
.bill { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; min-width: 0 }
.bill h3 { margin: 0 0 2px }
.bill p { font-size: .88rem }
.bill-f { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px }
.bill-f .btn { margin-left: auto }
.sel select { font: .9rem var(--f-body); padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); color: var(--ink) }

/* modal */
.modal { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--ink) 45%, transparent); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: max(24px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)) }
.sheet { width: min(760px, 100%); background: var(--card); border-radius: var(--r); border-top: 6px solid var(--box); padding: 22px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 50px -20px rgba(0,0,0,.45) }
.sheet.enter { animation: rise .18s ease-out }
@keyframes rise { from { transform: translateY(8px); opacity: .6 } to { transform: none; opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .sheet.enter { animation: none } }
.sheet h2 { font-size: 1.5rem }
.kicker { font: 500 .72rem var(--f-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--box) }
.sheet blockquote { margin: 0; padding: 12px 16px; border-left: 3px solid var(--line); background: var(--card-2); font-size: 1.02rem }
.choices { display: grid; grid-template-columns: 1fr; gap: 8px }
.choices.four { grid-template-columns: 1fr 1fr }
.choice { text-align: left; display: flex; flex-direction: column; gap: 3px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card-2); color: var(--ink); font: .88rem var(--f-body); cursor: pointer }
.choice strong { font: 600 1rem var(--f-display) }
.choice span { color: var(--muted) }
.choice span.good { color: var(--good) } .choice span.bad { color: var(--bad) }
.choice:hover:not([disabled]) { border-color: var(--box) }
.choice[disabled] { opacity: .5; cursor: not-allowed }
.sheet-f { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; padding-top: 4px }
.tips { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: .92rem }
.division { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.division > div { background: var(--card-2); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; align-items: center }
.dv-n { font: 700 2.2rem var(--f-display); font-variant-numeric: tabular-nums }
.legacy { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 }
.legacy > div { background: var(--card-2); padding: 10px; border-radius: var(--r) }
.legacy dt { font: 500 .7rem var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted) }
.legacy dd { margin: 0; font: 600 1.3rem var(--f-display) }

/* budget */
.budget { display: grid; grid-template-columns: 1fr 1fr; gap: 20px }
.budget > * { min-width: 0 }
.b-row { display: grid; grid-template-columns: minmax(0, 1fr) auto 2.6rem 6.8rem; align-items: center; gap: 6px; padding: 4px 0; border-bottom: 1px solid var(--line); font-size: .85rem }
.b-row label { min-width: 0 }
.stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 4px; overflow: hidden }
.stepper button { width: 26px; height: 28px; border: 0; background: var(--card-2); color: var(--ink); cursor: pointer; font-size: 1rem }
.stepper input { width: 3.8rem; border: 0; text-align: center; font: .85rem var(--f-mono); background: var(--card); color: var(--ink); height: 28px }
.unit { color: var(--muted); font-size: .75rem }
.delta { font: .75rem var(--f-mono); text-align: right }
.b-sum { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px }
.b-sum > * { min-width: 0; overflow-x: auto }
.dist { list-style: none; margin: 0; padding: 0; font-size: .85rem }
.dist li { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid var(--line) }
.warnings { margin: 0; padding: 10px 12px 10px 28px; background: var(--box-soft); border-radius: var(--r); font-size: .88rem }

/* policy */
.field textarea { font: .95rem/1.45 var(--f-body); resize: vertical; min-height: 4.5rem }
.ex-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.ex { font: .8rem var(--f-body); padding: 5px 10px; border-radius: 999px; border: 1px dashed var(--line); background: none; color: var(--muted); cursor: pointer; text-align: left }
.ex:hover { border-color: var(--bench); color: var(--ink) }
.tag { font: 600 .75rem var(--f-mono); padding: 4px 8px; border-radius: 4px; background: var(--bench-soft); color: var(--bench); white-space: nowrap }
.assess { border-top: 4px solid var(--bench) }
.notes { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: .9rem }
.mybills { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column }
.mybills li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line) }
.mybills li:first-child { border-top: 0 }
.mybills .btn.small { margin-top: 0 }
.sheet .field textarea { background: var(--card-2) }

/* this week */
.card.slim { padding-block: 12px }
.moves { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .88rem }
.mv strong { font-family: var(--f-mono); font-weight: 500 }
.issue { border-top: 4px solid var(--box) }
.issue.done { border-top-color: var(--good) }
.sugg { display: flex; flex-direction: column; gap: 6px; align-items: flex-start }
.sugg .ex { border-radius: var(--r); font-size: .86rem; padding: 7px 10px }
.announce { border-top: 4px solid var(--bench) }
.headline { font-size: 1.7rem; font-weight: 700; letter-spacing: -.01em }
.brief { margin: 0; display: flex; flex-direction: column; gap: 6px; font-size: .9rem }
.brief > div { display: grid; grid-template-columns: 7.5rem 1fr; gap: 8px }
.brief dt { color: var(--muted); font: 500 .74rem var(--f-mono); text-transform: uppercase; letter-spacing: .06em; padding-top: 3px }
.brief dd { margin: 0 }
.focus { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px }
.fg { margin: 0; background: var(--card-2); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px }
.fg figcaption { display: flex; flex-direction: column }
.fg blockquote { margin: 0; font-size: .9rem }
.fg .score { font-size: .95rem }
.regions, .seatlist, .quotes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: .86rem }
.regions li { display: grid; grid-template-columns: 11rem 1fr 2rem; gap: 8px; align-items: center }
.bar { height: 8px; background: var(--card-2); border-radius: 4px; overflow: hidden }
.bar > span { display: block; height: 100% }
.bar > .good { background: var(--good) } .bar > .warn { background: var(--warn) } .bar > .bad { background: var(--bad) }
.seatlist li { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding: 2px 0 }
.quotes li { border-left: 3px solid var(--line); padding: 4px 0 4px 10px }
.quotes p { font-size: .9rem }
.pmq-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px }
.pmq { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line) }
.pmq:first-child { border-top: 0; padding-top: 0 }
.pmq-q { border-left: 3px solid var(--line); padding-left: 10px }
.pmq-btns { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.pmq-btns .btn.small { margin-top: 0 }
.endweek { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap }

/* setup */
.setup { max-width: 720px; margin: 0 auto; padding-block: 40px 20px; display: flex; flex-direction: column; gap: 24px }
.setup-head { display: flex; flex-direction: column; gap: 10px; border-top: 6px solid var(--box); padding-top: 18px }
.eyebrow { font: 500 .72rem var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--box) }
.setup h1 { font-size: clamp(2.6rem, 8vw, 4.2rem); font-weight: 700; letter-spacing: -.02em }
.lede { font-size: 1.05rem; color: var(--muted); max-width: 60ch }
.setup-form { display: flex; flex-direction: column; gap: 18px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 20px }
.field { display: flex; flex-direction: column; gap: 6px; border: 0; padding: 0; margin: 0; min-width: 0; flex: 1 }
.field.small { flex: 0 0 7rem }
.field-row { display: flex; gap: 12px; flex-wrap: wrap }
.field label, .field legend { font: 600 .82rem var(--f-display); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 0 }
.field label.sub { margin-top: 8px }
.field input, .field select, .field textarea { font: 1rem var(--f-body); padding: 9px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card-2); color: var(--ink); width: 100% }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { position: relative; cursor: pointer }
.chip input { position: absolute; opacity: 0; inset: 0; cursor: pointer }
.chip span { display: inline-block; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: .88rem; background: var(--card-2) }
.chip input:checked + span { background: var(--bench); border-color: var(--bench); color: var(--card) }
.chip input:focus-visible + span { outline: 2px solid var(--brass); outline-offset: 2px }
.err { color: var(--bad); font-size: .9rem }
.foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 24px; font-size: .82rem; color: var(--muted) }

@media (max-width: 900px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)) }
  .grid.two, .budget, .b-sum { grid-template-columns: minmax(0, 1fr) }
}
@media (max-width: 560px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .grid.three { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .split { grid-template-columns: minmax(0, 1fr) }
  .redbox li, .news li { grid-template-columns: 1fr; gap: 2px }
  .choices.four { grid-template-columns: 1fr }
  .legacy { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .b-row { grid-template-columns: minmax(0, 1fr) auto; }
  .b-row .unit { display: none }
  .b-row .delta { grid-column: 1 / -1; text-align: left }
  .topbar { position: static }
  .next { width: 100% }
  .bill-list { grid-template-columns: minmax(0, 1fr) }
  .mybills li { grid-template-columns: minmax(0, 1fr) auto }
  .regions li { grid-template-columns: 7.5rem 1fr 2rem }
  .brief > div { grid-template-columns: 1fr; gap: 0 }
  .endweek .btn { width: 100% }
  .mybills li .btn { grid-column: 1 / -1; justify-self: start }
}
</style>
</head>
<body>
<div id="app"></div>
<script src="content.js"></script>
<script src="real.js"></script>
<script src="week.js"></script>
<script src="game.js"></script>
</body>
